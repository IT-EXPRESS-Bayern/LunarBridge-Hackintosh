---
version:         '1.73'
kernels:
  - name:            lunarbridge_xe2_probe
    user_attributes:
      intel_reqd_workgroup_walk_order: [ 0, 1, 2 ]
    execution_env:
      disable_mid_thread_preemption: true
      grf_count:       128
      has_4gb_buffers: true
      has_no_stateless_write: true
      inline_data_payload_size: 32
      offset_to_skip_per_thread_data_load: 128
      simd_size:       32
      subgroup_independent_forward_progress: true
      eu_thread_count: 8
    payload_arguments:
      - arg_type:        global_id_offset
        offset:          0
        size:            12
      - arg_type:        enqueued_local_size
        offset:          12
        size:            12
      - arg_type:        arg_bypointer
        offset:          24
        size:            8
        arg_index:       0
        addrmode:        stateless
        addrspace:       global
        access_type:     readonly
      - arg_type:        arg_bypointer
        offset:          32
        size:            8
        arg_index:       1
        addrmode:        stateless
        addrspace:       global
        access_type:     readwrite
      - arg_type:        arg_byvalue
        offset:          40
        size:            4
        arg_index:       2
    per_thread_payload_arguments:
      - arg_type:        local_id
        offset:          0
        size:            64
kernels_misc_info:
  - name:            lunarbridge_xe2_probe
    args_info:
      - index:           0
        name:            input
        address_qualifier: __global
        access_qualifier: NONE
        type_name:       'uint*;8'
        type_qualifiers: const
      - index:           1
        name:            output
        address_qualifier: __global
        access_qualifier: NONE
        type_name:       'uint*;8'
        type_qualifiers: NONE
      - index:           2
        name:            count
        address_qualifier: __private
        access_qualifier: NONE
        type_name:       'uint;4'
        type_qualifiers: NONE
...
