name: IOAccelerator call observations

on:
  push:
    paths:
      - tools/ioaccel_calls.py
      - tools/ioaccel-requirements.txt
      - tools/recovery_graphics.py
      - tests/test_ioaccel_calls.py
      - .github/workflows/ioaccel-calls.yml
      - docs/IOACCEL_CALLS.md
      - docs/IOACCEL_CALLS.json
  pull_request:
    paths:
      - tools/ioaccel_calls.py
      - tools/ioaccel-requirements.txt
      - tools/recovery_graphics.py
      - tests/test_ioaccel_calls.py
      - .github/workflows/ioaccel-calls.yml
      - docs/IOACCEL_CALLS.md
      - docs/IOACCEL_CALLS.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Synthetic call boundaries on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the pinned disassembler for synthetic code
        run: python -m pip install --only-binary=:all: --require-hashes -r tools/ioaccel-requirements.txt
      - name: Check slide chains and literal call arguments
        run: python -B -X utf8 tests/test_ioaccel_calls.py --report build/ioaccel-calls-test-report.json
      - name: Retain source hashes and test counts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: LunarBridge-IOAccel-Calls-${{ matrix.os }}
          path: build/ioaccel-calls-test-report.json
          if-no-files-found: error
          retention-days: 14
